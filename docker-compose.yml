services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: remotebrief
      POSTGRES_PASSWORD: remotebrief
      POSTGRES_DB: remotebrief
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remotebrief"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-совместимое хранилище RustFS (замена MinIO, который удалил свои
  # образы из Docker Hub и закрыл quay.io). Пока не требуется: документы
  # хранятся в PostgreSQL (Document.content), S3 — задел фазы 4.
  # Если нужна минимальная инфраструктура — блок можно удалить целиком.
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: remotebrief
      RUSTFS_SECRET_KEY: remotebrief123
    volumes:
      - rustfsdata:/data

  # Локальный почтовый сервер: письма с протоколами падают сюда в dev-режиме
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  rustfsdata:
